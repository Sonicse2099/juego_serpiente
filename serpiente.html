<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonicse Snake 🦔</title>
  <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <h1>🦔 Sonicse Snake</h1>
    <p class="descripcion">
      ¡Ayuda a Sonic a recoger los anillos dorados! Evita los bordes o será Game Over.
    </p>

    <section class="panel-info">
      <div class="tarjeta-info">
        <span>💍 Anillos</span>
        <strong id="puntaje">0</strong>
      </div>
      <div class="tarjeta-info">
        <span>Estado</span>
        <strong id="estado">Listo</strong>
      </div>
    </section>

    <canvas id="canvasJuego" width="600" height="600"></canvas>

    <div class="zona-controles">
      <section class="controles">
        <button class="vacio">-</button>
        <button onclick="cambiarDireccion('arriba')">⬆️</button>
        <button class="vacio">-</button>
        <button onclick="cambiarDireccion('izquierda')">⬅️</button>
        <button class="vacio">-</button>
        <button onclick="cambiarDireccion('derecha')">➡️</button>
        <button class="vacio">-</button>
        <button onclick="cambiarDireccion('abajo')">⬇️</button>
        <button class="vacio">-</button>
      </section>

      <div class="acciones-derecha">
        <div class="acciones-top">
          <button class="btn-pausar" onclick="pausarJuego()">⏸️ Pausar</button>
          <button class="btn-iniciar" onclick="iniciarJuego()">▶️ Iniciar</button>
        </div>
        <button class="btn-reiniciar" onclick="reiniciarJuego()">🔄 Reiniciar</button>
      </div>
    </div>

    <p id="mensaje" class="mensaje">Presiona iniciar para comenzar.</p>
  </main>
  <script src="serpiente.js"></script>
</body>
</html>
